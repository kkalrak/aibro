[package]
name = "aibro"
version = "0.1.0"
edition = "2024"
description = "An agent-first Chromium browser, owned and operated locally"
license = "MIT OR Apache-2.0"
default-run = "aibro"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cef = "=156.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
